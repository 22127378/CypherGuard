# Falco event-generator: replays known-malicious syscall actions so you can
# confirm the Falco -> Wazuh pipeline end to end against the default ruleset
# (separate from the scripted attack, which exercises the custom rules).
#
# Runs in the `falco` namespace, which is exempt from the PSS baseline policy,
# because some actions need host access. NEVER run this in an app namespace.
#
#   kubectl apply -f tests/detection/falco-eventgen-job.yaml
#   kubectl -n falco logs job/falco-event-generator
#   # then check Wazuh for Falco alerts, and delete:
#   kubectl -n falco delete job falco-event-generator
apiVersion: batch/v1
kind: Job
metadata:
  name: falco-event-generator
  namespace: falco
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: cipherguard
    spec:
      restartPolicy: Never
      containers:
        - name: event-generator
          image: falcosecurity/event-generator:0.13.0
          args: ["run", "syscall", "--loop", "--sleep", "5s"]
          securityContext:
            runAsUser: 0
