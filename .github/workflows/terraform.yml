name: terraform

# PR: fmt/validate + plan (read-only role).
# Manual run on main: plan -> approval on environment "lab" -> apply or destroy.
on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"
  # checkov:skip=CKV_GHA_7:Input only selects apply/destroy of reviewed infra; no build artifact is produced
  workflow_dispatch:
    inputs:
      action:
        description: "apply = create/update the lab, destroy = tear it down"
        type: choice
        options: [apply, destroy]
        default: apply

permissions:
  contents: read

concurrency:
  group: terraform-lab
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  TF_VERSION: 1.14.6
  TF_DIR: infra/terraform
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_cluster_admin_arns: ${{ vars.CLUSTER_ADMIN_ARNS || '[]' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate bootstrap
        run: terraform -chdir=infra/bootstrap init -backend=false && terraform -chdir=infra/bootstrap validate
      - name: validate lab
        run: terraform -chdir=$TF_DIR init -backend=false && terraform -chdir=$TF_DIR validate

  plan:
    needs: check
    # Forks get no OIDC token; only plan for branches in this repo.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}
      - name: init
        run: >
          terraform -chdir=$TF_DIR init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=lab/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="encrypt=true"
      - name: plan
        env:
          ACTION: ${{ inputs.action || 'pull request' }}
        run: |
          DESTROY=""
          if [ "$ACTION" = "destroy" ]; then DESTROY="-destroy"; fi
          terraform -chdir=$TF_DIR plan $DESTROY -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan ($ACTION)"
            echo '```'
            grep -E '^(Plan:|No changes|  [#~+-])' plan.txt | head -200
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: upload plan
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Required reviewers on this environment = manual approval before apply.
    environment: lab
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-apply-${{ github.run_id }}
          role-duration-seconds: 7200
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}
      - name: init
        run: >
          terraform -chdir=$TF_DIR init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=lab/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"
          -backend-config="encrypt=true"
      - name: apply reviewed plan
        run: terraform -chdir=$TF_DIR apply -no-color tfplan
