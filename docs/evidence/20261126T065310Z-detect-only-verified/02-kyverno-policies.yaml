    annotations:
      cipherguard.io/mitre: T1610,T1195.002
      meta.helm.sh/release-name: cluster-policies
      meta.helm.sh/release-namespace: default
      policies.kyverno.io/severity: high
      policies.kyverno.io/title: Verify Cosign signature and SBOM attestation
    creationTimestamp: "2026-11-26T06:21:49Z"
    generation: 1
    labels:
      app.kubernetes.io/managed-by: Helm
      app.kubernetes.io/part-of: cipherguard
      cipherguard.io/policy-mode: Audit
    name: verify-image-signatures
    resourceVersion: "18159"
    uid: 270720c7-fbfa-4a7a-9429-1071e59b3fa0
  spec:
    attestations:
    - intoto:
        type: https://spdx.dev/Document
      name: sbom
    attestors:
    - cosign:
        ctlog:
          url: https://rekor.sigstore.dev
        keyless:
          identities:
          - issuer: https://token.actions.githubusercontent.com
            subject: https://github.com/22127378/CypherGuard/.github/workflows/build.yml@refs/heads/main
      name: cosign
    credentials:
      providers:
      - amazon
    evaluation:
      background:
        enabled: false
    failurePolicy: Fail
    matchConstraints:
      resourceRules:
      - apiGroups:
        - ""
        apiVersions:
        - v1
        operations:
        - CREATE
        - UPDATE
        resources:
        - pods
    matchImageReferences:
    - glob: 728384804953.dkr.ecr.ap-southeast-1.amazonaws.com/cipherguard/demo-app@*
    - glob: 728384804953.dkr.ecr.ap-southeast-1.amazonaws.com/cipherguard/demo-app:*
    validationActions:
    - Audit
    validationConfigurations:
      mutateDigest: true
      required: true
