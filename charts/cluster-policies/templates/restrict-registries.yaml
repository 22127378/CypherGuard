# Without this, an image from another registry would never match the
# signature policy's image globs and would skip verification entirely.
{{- $repo := include "cp.repository" . }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  labels:
    {{- include "cp.labels" . | nindent 4 }}
  annotations:
    policies.kyverno.io/title: App namespaces pull only from the lab ECR repository
    policies.kyverno.io/severity: high
    cipherguard.io/mitre: T1610
spec:
  validationActions: {{ include "cp.actions" . }}
  failurePolicy: Fail
  matchConstraints:
    {{- include "cp.podRules" . | nindent 4 }}
  matchConditions:
    - name: app-namespaces
      expression: "request.namespace in {{ include "cp.celList" .Values.appNamespaces }}"
  variables:
    {{- include "cp.containersVar" . | nindent 4 }}
  validations:
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('{{ $repo }}@') || c.image.startsWith('{{ $repo }}:'))
      message: "Images in app namespaces must come from {{ $repo }}."
