apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ . }}
  {{- end }}
# No Kubernetes API token in the pod (attack step 2). IRSA still works: the EKS
# pod identity webhook mounts its own projected token for STS only.
automountServiceAccountToken: false
