apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "demo-app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
