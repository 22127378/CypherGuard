<!-- Pushed by the manager to every agent in group "eks-nodes". -->
<agent_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/falco/events.json</location>
    <!--
      Default "yes" makes logcollector skip lines written while the agent was
      restarting or reconnecting (e.g. after a manager restart). Found live:
      Falco wrote every event but some never reached Wazuh. With "no" the
      agent resumes from its saved offset, so those lines are still shipped.
    -->
    <only-future-events>no</only-future-events>
  </localfile>
</agent_config>
